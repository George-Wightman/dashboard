<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today</title>
  <meta name="theme-color" content="#f5f0e7">
  <script>
    // The look before the page paints, so a Night evening never flashes Paper. The same rule as
    // resolveLook in js/look.js; tests/look.test.js runs this script to keep the two in step.
    (function () {
      var s = { look: 'auto', checkinHour: 18, dayStartHour: 4 };
      try { var saved = JSON.parse(localStorage.getItem('dash_settings')); for (var k in s) if (saved && k in saved) s[k] = saved[k]; } catch (e) {}
      var h = new Date().getHours();
      var look = s.look === 'paper' || s.look === 'night' ? s.look : (h >= s.checkinHour || h < s.dayStartHour ? 'night' : 'paper');
      document.documentElement.dataset.theme = look;
      document.querySelector('meta[name="theme-color"]').content = look === 'night' ? '#1c232b' : '#f5f0e7';
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-date">
      <h1 id="date"></h1>
      <span id="count" class="muted"></span>
    </div>
    <div class="top-actions">
      <span id="save-warning" class="warning" hidden></span>
      <button id="update-ready" class="link update-ready" type="button" title="A newer version is downloaded and ready" hidden>Update ready · reload</button>
      <button id="sync-status" class="link" type="button"></button>
      <button id="flag-button" class="icon flag-button" type="button" title="Note something to change" aria-label="Note something to change">⚑</button>
      <button id="arrange-button" class="link" type="button" aria-pressed="false">Arrange</button>
      <button id="settings-button" class="icon" type="button" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="layout">
    <section class="today" aria-label="Today">
      <p id="arrange-note" class="arrange-note" hidden>Today's list stays here</p>
      <ul id="list" class="list"></ul>
      <form id="add" class="add" autocomplete="off">
        <input id="add-title" type="text" placeholder="Add a task…" aria-label="New task">
        <select id="add-when" aria-label="When">
          <option value="today">Today</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="date">On a date…</option>
        </select>
        <input id="add-date" type="date" hidden aria-label="Date">
        <button id="add-more" type="button" class="link">New habit, quota or goal…</button>
      </form>
    </section>
    <aside id="side" class="side" aria-label="Widgets"></aside>
  </main>

  <aside id="editor" class="editor" hidden aria-label="Edit"></aside>
  <dialog id="settings" class="settings"></dialog>
  <dialog id="flags" class="settings flags" aria-label="Flags"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
