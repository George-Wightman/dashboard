# The phone's widgets app (android/): tests, then an unsigned build, on GitHub's machines, whose
# Android tools come with their licences accepted. The app and pictures of every widget go to the
# android-builds branch; android/README.md says how it's signed (on the laptop) and installed.
name: Widgets app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build
        run: gradle -p android testDebugUnitTest assembleRelease --no-daemon --stacktrace
      - name: Publish to android-builds
        if: always()
        run: |
          mkdir -p out/shots
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/ 2>/dev/null || true
          cp android/app/build/widget-shots/*.png out/shots/ 2>/dev/null || true
          mkdir -p out/tests && cp -r android/app/build/test-results/testDebugUnitTest/*.xml out/tests/ 2>/dev/null || true
          echo "${GITHUB_SHA} run ${GITHUB_RUN_NUMBER} ${{ job.status }}" > out/BUILD.txt
          cd out
          git init -q -b android-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Widgets app from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds
